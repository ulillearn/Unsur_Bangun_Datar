<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tarik Tambang - Bangun Datar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --purple: #8b3dff;
        --purple2: #a855f7;

        --blue: #3b82f6;
        --red: #ff5a7a;

        --yellow: #ffe66d;
        --green: #4ade80;

        --brown: #5b3213;

        --bg: #fffaf6;

        --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      body {
        font-family: "Baloo 2", cursive;

        background:
          radial-gradient(circle at top left, #dbeafe 0%, transparent 18%),
          radial-gradient(circle at bottom right, #fef3c7 0%, transparent 18%),
          linear-gradient(180deg, #fffaff, #fff6f1);

        min-height: 100vh;
        overflow-x: hidden;

        color: var(--brown);
      }

      /* ===================================
            CONTAINER
=================================== */

      .container {
        width: min(1250px, 94%);
        margin: auto;
        padding: 30px 0 80px;
      }

      /* ===================================
            HEADER
=================================== */

      .top-header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        flex-wrap: wrap;
        gap: 15px;

        margin-bottom: 30px;
      }

      .back-btn {
        text-decoration: none;
        background: white;

        color: var(--purple);

        font-weight: 800;

        padding: 12px 22px;
        border-radius: 18px;

        box-shadow: var(--shadow);

        transition: 0.25s;
      }

      .back-btn:hover {
        transform: translateY(-3px);
      }

      .title {
        text-align: center;
        flex: 1;
      }

      .title h1 {
        font-size: clamp(2.6rem, 5vw, 4.7rem);

        color: var(--purple);

        line-height: 1.1;

        text-shadow:
          -4px -4px 0 white,
          4px -4px 0 white,
          -4px 4px 0 white,
          4px 4px 0 white,
          0 10px 18px rgba(0, 0, 0, 0.12);
      }

      .title p {
        font-size: 1.3rem;
        font-weight: 700;
      }

      /* ===================================
            SCOREBOARD
=================================== */

      .scoreboard {
        display: grid;
        grid-template-columns: 1fr auto 1fr;

        align-items: center;

        gap: 20px;

        margin-bottom: 30px;
      }

      .team-card {
        background: white;
        border-radius: 30px;

        padding: 22px;

        text-align: center;

        box-shadow: var(--shadow);
      }

      .team-card h2 {
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .team-blue h2 {
        color: var(--blue);
      }

      .team-red h2 {
        color: var(--red);
      }

      .score {
        font-size: 3.5rem;
        font-weight: 800;
      }

      .vs {
        font-size: 2rem;
        font-weight: 800;

        color: var(--purple);
      }

      /* ===================================
            GAME AREA
=================================== */

      .game-area {
        background: white;
        border-radius: 40px;

        padding: 35px;

        box-shadow: var(--shadow);

        margin-bottom: 35px;

        overflow: hidden;
        position: relative;
      }

      /* ===================================
            ROPE AREA
=================================== */

      .rope-scene {
        position: relative;

        width: 100%;
        height: 270px;

        border-radius: 30px;

        overflow: hidden;

        background: linear-gradient(
          to bottom,
          #87ceeb 0%,
          #c7f0ff 55%,
          #8fdc7c 55%,
          #6ccf66 100%
        );

        margin-bottom: 35px;
      }

      /* awan */

      .cloud {
        position: absolute;
        background: white;
        border-radius: 50px;
        opacity: 0.9;
      }

      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        background: white;
        border-radius: 50%;
      }

      .cloud1 {
        width: 90px;
        height: 40px;

        top: 30px;
        left: 10%;
      }

      .cloud1::before {
        width: 40px;
        height: 40px;

        top: -15px;
        left: 10px;
      }

      .cloud1::after {
        width: 50px;
        height: 50px;

        top: -20px;
        right: 10px;
      }

      .cloud2 {
        width: 120px;
        height: 45px;

        top: 50px;
        right: 10%;
      }

      .cloud2::before {
        width: 45px;
        height: 45px;

        top: -15px;
        left: 18px;
      }

      .cloud2::after {
        width: 55px;
        height: 55px;

        top: -25px;
        right: 18px;
      }

      /* garis tengah */

      .center-line {
        position: absolute;
        left: 50%;
        top: 0;

        width: 8px;
        height: 100%;

        background: repeating-linear-gradient(
          to bottom,
          #ffffff,
          #ffffff 12px,
          #ff3b3b 12px,
          #ff3b3b 24px
        );

        transform: translateX(-50%);
      }

      /* ROPE */

      .rope {
        position: absolute;
        top: 50%;
        left: 50%;

        width: 500px;
        height: 12px;

        background: #a16207;

        border-radius: 50px;

        transform: translate(-50%, -50%) translateX(var(--rope-offset));

        transition: 1s cubic-bezier(0.22, 1, 0.36, 1);

        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.18);
      }

      .flag {
        position: absolute;
        top: 50%;
        left: 50%;

        width: 20px;
        height: 45px;

        transform: translate(-50%, -50%) translateX(var(--rope-offset));

        transition: 1s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .flag::before {
        content: "";

        position: absolute;
        width: 6px;
        height: 45px;

        background: #444;
        left: 7px;
      }

      .flag::after {
        content: "";

        position: absolute;

        width: 18px;
        height: 14px;

        background: red;

        top: 2px;
        left: 12px;

        clip-path: polygon(0 0, 100% 50%, 0 100%);
      }

      /* players */

      .player {
        position: absolute;
        top: 50%;

        transform: translateY(-50%);

        font-size: 4rem;

        transition: 1s ease;
      }

      .player.left {
        left: 15%;
      }

      .player.right {
        right: 15%;
      }

      /* ===================================
            QUESTION CARD
=================================== */

      .question-card {
        background: linear-gradient(135deg, #faf5ff, #ffffff);

        border-radius: 35px;

        padding: 35px;

        box-shadow: var(--shadow);
      }

      .question-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;

        margin-bottom: 25px;
        flex-wrap: wrap;
      }

      .question-number {
        background: linear-gradient(135deg, #8b3dff, #a855f7);

        color: white;

        padding: 12px 22px;
        border-radius: 18px;

        font-size: 1.3rem;
        font-weight: 800;
      }

      .progress {
        flex: 1;
        min-width: 200px;

        height: 18px;
        background: #ececec;

        border-radius: 50px;
        overflow: hidden;
      }

      .progress-fill {
        width: 0%;
        height: 100%;

        background: linear-gradient(90deg, #8b3dff, #c084fc);

        transition: 0.4s;
      }

      .question-content {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 30px;

        align-items: center;
      }

      .question-text {
        font-size: 1.8rem;
        font-weight: 800;
        line-height: 1.4;
      }

      .answers {
        margin-top: 25px;

        display: grid;
        gap: 16px;
      }

      .answer-btn {
        border: none;
        cursor: pointer;

        background: white;

        padding: 18px 22px;
        border-radius: 22px;

        font-family: "Baloo 2", cursive;

        font-size: 1.2rem;
        font-weight: 700;

        color: var(--brown);

        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);

        transition: 0.25s;

        text-align: left;
      }

      .answer-btn:hover {
        transform: translateY(-3px) scale(1.01);

        background: #faf5ff;
      }

      .answer-btn.correct {
        background: #dcfce7;
        border: 3px solid #22c55e;
      }

      .answer-btn.wrong {
        background: #ffe2e2;
        border: 3px solid #ef4444;
      }

      .question-image {
        background: white;

        border-radius: 25px;
        padding: 15px;

        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);

        text-align: center;
      }

      .question-image img {
        width: 100%;
        border-radius: 18px;
      }

      .hidden {
        display: none;
      }

      /* ===================================
            TURN INFO
=================================== */

      .turn-box {
        text-align: center;

        margin-bottom: 20px;
      }

      .turn-badge {
        display: inline-block;

        padding: 12px 25px;

        border-radius: 20px;

        color: white;

        font-size: 1.3rem;
        font-weight: 800;

        box-shadow: var(--shadow);
      }

      .turn-blue {
        background: linear-gradient(135deg, #3b82f6, #60a5fa);
      }

      .turn-red {
        background: linear-gradient(135deg, #ff5a7a, #ff7b94);
      }

      /* ===================================
            RESULT
=================================== */

      .result-screen {
        display: none;

        background: white;
        border-radius: 40px;

        padding: 60px 35px;

        text-align: center;

        box-shadow: var(--shadow);

        animation: pop 0.6s ease;
      }

      .result-screen h2 {
        font-size: 4rem;
        color: var(--purple);

        margin-bottom: 20px;
      }

      .result-screen p {
        font-size: 1.8rem;
        font-weight: 700;

        margin-bottom: 35px;
      }

      .play-again {
        border: none;
        cursor: pointer;

        background: linear-gradient(135deg, #8b3dff, #a855f7);

        color: white;

        padding: 18px 35px;
        border-radius: 22px;

        font-size: 1.3rem;
        font-family: "Baloo 2", cursive;
        font-weight: 800;

        box-shadow: var(--shadow);
      }

      /* ===================================
            ANIMATION
=================================== */

      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.8);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* ===================================
            RESPONSIVE
=================================== */

      @media (max-width: 950px) {
        .question-content {
          grid-template-columns: 1fr;
        }

        .scoreboard {
          grid-template-columns: 1fr;
        }

        .vs {
          display: none;
        }

        .rope {
          width: 320px;
        }

        .player {
          font-size: 3rem;
        }

        .player.left {
          left: 6%;
        }

        .player.right {
          right: 6%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- HEADER -->

      <div class="top-header">
        <a href="/index.html" class="back-btn"> ← Kembali ke Beranda </a>

        <div class="title">
          <h1>Tarik Tambang</h1>

          <p>Jawab pertanyaan dan tarik tali untuk memenangkan pertandingan!</p>
        </div>
      </div>

      <!-- SCORE -->

      <div class="scoreboard">
        <div class="team-card team-blue">
          <h2>🔵 Tim Biru</h2>

          <div class="score" id="blueScore">0</div>
        </div>

        <div class="vs">VS</div>

        <div class="team-card team-red">
          <h2>🔴 Tim Merah</h2>

          <div class="score" id="redScore">0</div>
        </div>
      </div>

      <!-- GAME -->

      <div class="game-area">
        <!-- TURN -->

        <div class="turn-box">
          <div class="turn-badge turn-blue" id="turnBadge">
            Giliran Tim Biru
          </div>
        </div>

        <!-- ROPE -->

        <div class="rope-scene">
          <div class="cloud cloud1"></div>
          <div class="cloud cloud2"></div>

          <div class="center-line"></div>

          <div class="player left">🧒🧒🧒</div>

          <div class="player right">🧒🧒🧒</div>

          <div class="rope" id="rope"></div>

          <div class="flag" id="flag"></div>
        </div>

        <!-- QUESTION -->

        <div class="question-card" id="questionCard">
          <div class="question-top">
            <div class="question-number" id="questionNumber">Soal 1</div>

            <div class="progress">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>

          <div class="question-content">
            <div>
              <div class="question-text" id="questionText"></div>

              <div class="answers" id="answersContainer"></div>
            </div>

            <div class="question-image hidden" id="questionImageBox">
              <img src="" id="questionImage" />
            </div>
          </div>
        </div>
      </div>

      <!-- RESULT -->

      <div class="result-screen" id="resultScreen">
        <h2 id="winnerText">🎉 Tim Menang!</h2>

        <p id="winnerDesc"></p>

        <button class="play-again" onclick="location.reload()">
          Main Lagi
        </button>
      </div>
    </div>

    <script>
      const questions = [
        {
          question:
            "Manakah di bawah ini yang merupakan pengertian dari 'Ruas Garis'?",
          answers: [
            "A. Bagian garis yang memiliki satu titik awal dan memanjang ke satu arah saja.",
            "B. Bagian dari garis yang memiliki dua titik ujung dengan panjang tertentu.",
            "C. Garis yang melengkung dan tidak memiliki titik sudut.",
            "D. Kumpulan titik yang memanjang ke dua arah tanpa batas",
          ],
          correct: 1,
        },

        {
          question:
            "Berapakah jumlah sisi dan jumlah sudut yang dimiliki oleh sebuah bangun datar segitiga?",
          answers: [
            "A. 3 sisi dan 3 sudut",
            "B. 3 sisi dan 4 sudut",
            "C. 2 sisi dan 2 sudut",
            "D. 4 sisi dan 4 sudut",
          ],
          correct: 0,
        },

        {
          question:
            "Jika dua ruas garis bertemu di satu titik dan membentuk pojok tegak lurus seperti huruf L, sudut apa yang terbentuk?",
          answers: [
            "A. Sudut Tumpul",
            "B. Sudut Garis",
            "C. Sudut Siku-siku",
            "D. Sudut Lancip",
          ],
          correct: 2,
        },

        {
          question:
            "Pada gambar penggaris di bawah ini, berapakah panjang ruas garis P-Q?",
          image: "img_soal_penggaris.png",
          answers: ["A. 5.5 cm", "B. 10 mm", "C. 4 cm", "D. 3.8 cm"],
          correct: 3,
        },

        {
          question:
            "Berdasarkan gambar pembagian sudut, jenis sudut apakah yang besarnya kurang dari 90 derajat?",
          image: "img_soal_busur.png",
          answers: [
            "A. Sudut Ruang",
            "B. Sudut Tumpul",
            "C. Sudut Lancip",
            "D. Sudut Siku-siku",
          ],
          correct: 2,
        },

        {
          question:
            "Manakah benda berikut yang memiliki sudut tumpul pada permukaannya?",
          answers: [
            "A. Sisi ubin lantai.",
            "B. Layar laptop yang dibuka lebar lebih dari siku-siku.",
            "C. Ujung pensil yang runcing.",
            "D. Pojok buku tulis.",
          ],
          correct: 1,
        },

        {
          question:
            "Jarum jam pada gambar di samping menunjukkan jenis sudut apa?",
          image: "img_soal_jam.png",
          answers: [
            "A. Sudut Ruang",
            "B. Sudut Tumpul",
            "C. Sudut Lancip",
            "D. Sudut Siku-siku",
          ],
          correct: 1,
        },

        {
          question:
            "Jika 1 sentimeter sama dengan 10 milimeter, berapakah nilai milimeter jika panjang sebuah garis adalah 2 cm?",
          answers: ["A. 12 mm", "B. 2000 mm", "C. 200 mm", "D. 20 mm"],
          correct: 3,
        },

        {
          question:
            "Pada gambar penggaris di bawah ini, berapakah panjang ruas garis M-N?",
          image: "img_soal_penggaris2.png",
          answers: ["A. 5.5 cm", "B. 10 mm", "C. 4 cm", "D. 3.8 cm"],
          correct: 0,
        },
      ];

      let currentQuestion = 0;

      let blueScore = 0;
      let redScore = 0;

      let currentTeam = "blue";

      let ropeOffset = 0;

      const questionText = document.getElementById("questionText");
      const answersContainer = document.getElementById("answersContainer");

      const questionNumber = document.getElementById("questionNumber");

      const progressFill = document.getElementById("progressFill");

      const blueScoreText = document.getElementById("blueScore");
      const redScoreText = document.getElementById("redScore");

      const rope = document.getElementById("rope");
      const flag = document.getElementById("flag");

      const turnBadge = document.getElementById("turnBadge");

      const questionImage = document.getElementById("questionImage");
      const questionImageBox = document.getElementById("questionImageBox");

      const resultScreen = document.getElementById("resultScreen");

      function loadQuestion() {
        const q = questions[currentQuestion];

        questionNumber.innerHTML = `Soal ${currentQuestion + 1}`;

        progressFill.style.width = `${(currentQuestion / questions.length) * 100}%`;

        questionText.innerHTML = q.question;

        answersContainer.innerHTML = "";

        if (q.image) {
          questionImage.src = q.image;
          questionImageBox.classList.remove("hidden");
        } else {
          questionImageBox.classList.add("hidden");
        }

        q.answers.forEach((answer, index) => {
          const btn = document.createElement("button");

          btn.className = "answer-btn";
          btn.innerHTML = answer;

          btn.onclick = () => checkAnswer(index, btn);

          answersContainer.appendChild(btn);
        });
      }

      function checkAnswer(selected, button) {
        const q = questions[currentQuestion];

        const buttons = document.querySelectorAll(".answer-btn");

        buttons.forEach((btn) => (btn.disabled = true));

        if (selected === q.correct) {
          button.classList.add("correct");

          if (currentTeam === "blue") {
            blueScore++;
            ropeOffset -= 45;

            blueScoreText.innerHTML = blueScore;
          } else {
            redScore++;
            ropeOffset += 45;

            redScoreText.innerHTML = redScore;
          }

          updateRope();
        } else {
          button.classList.add("wrong");

          buttons[q.correct].classList.add("correct");
        }

        setTimeout(() => {
          currentQuestion++;

          if (currentQuestion >= questions.length) {
            finishGame();
            return;
          }

          currentTeam = currentTeam === "blue" ? "red" : "blue";

          updateTurn();

          loadQuestion();
        }, 1800);
      }

      function updateRope() {
        rope.style.setProperty("--rope-offset", `${ropeOffset}px`);

        flag.style.setProperty("--rope-offset", `${ropeOffset}px`);
      }

      function updateTurn() {
        if (currentTeam === "blue") {
          turnBadge.innerHTML = "Giliran Tim Biru";

          turnBadge.className = "turn-badge turn-blue";
        } else {
          turnBadge.innerHTML = "Giliran Tim Merah";

          turnBadge.className = "turn-badge turn-red";
        }
      }

      function finishGame() {
        document.querySelector(".game-area").style.display = "none";

        resultScreen.style.display = "block";

        const winnerText = document.getElementById("winnerText");

        const winnerDesc = document.getElementById("winnerDesc");

        if (blueScore > redScore) {
          winnerText.innerHTML = "🔵 Tim Biru Menang!";

          winnerDesc.innerHTML = `Tim Biru berhasil menarik tali dan memenangkan pertandingan dengan skor ${blueScore} - ${redScore}!`;
        } else if (redScore > blueScore) {
          winnerText.innerHTML = "🔴 Tim Merah Menang!";

          winnerDesc.innerHTML = `Tim Merah berhasil menarik tali dan memenangkan pertandingan dengan skor ${redScore} - ${blueScore}!`;
        } else {
          winnerText.innerHTML = "🤝 Hasil Seri!";

          winnerDesc.innerHTML = `Kedua tim bermain sangat baik dengan skor ${blueScore} - ${redScore}.`;
        }
      }

      loadQuestion();
    </script>
  </body>
</html>
