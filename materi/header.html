<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Header Materi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Baloo 2", cursive;
      }

      header {
        width: 100%;
        height: 90px;
        background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 45px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        position: sticky;
        top: 0;
        z-index: 999;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 15px;
        color: white;
        text-decoration: none;
      }

      .logo-icon {
        width: 55px;
        height: 55px;
        border-radius: 18px;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      }

      .logo-text {
        font-size: 1.7rem;
        font-weight: 800;
        line-height: 1;
      }

      nav {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      nav a {
        text-decoration: none;
        color: white;
        font-size: 1.15rem;
        font-weight: 700;
        padding: 10px 20px;
        border-radius: 14px;
        transition: 0.25s;
      }

      nav a:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: translateY(-2px);
      }

      .active {
        background: white;
        color: #7c3aed;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.12);
      }

      @media (max-width: 900px) {
        header {
          height: auto;
          padding: 20px;
          flex-direction: column;
          gap: 18px;
        }

        .logo {
          width: 100%;
          justify-content: center;
        }

        nav {
          justify-content: center;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <a href="/index.html" class="logo">
        <div class="logo-icon">📘</div>

        <div class="logo-text">Bangun Datar</div>
      </a>

      <nav>
        <a href="/index.html"> 🏠 Beranda </a>

        <a href="/materi/sisi_bangun_datar.html" class="active"> 📏 Sisi </a>

        <a href="/materi/sudut_bangun_datar.html"> 📐 Sudut </a>

        <a href="/materi/garis_tegak_lurus_sejajar.html"> 📊 Garis </a>
      </nav>
    </header>
  </body>
</html>
